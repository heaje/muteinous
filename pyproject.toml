[build-system]
requires = ["setuptools>=75,<83", "setuptools-scm>=8,<10"]
build-backend = "setuptools.build_meta"

[project]
name = "muteinous"
dynamic = ["version"]
description = "Muteinous v2 (implementation bootstrap)"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-xdist[psutil]>=3.6,<4",
    "ruff>=0.12,<1",
    "mypy>=1.15,<2",
    "commitizen>=4,<5",
    "setuptools>=75,<83",
    "setuptools-scm>=8,<10",
    "wheel>=0.45,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
version_scheme = "pep440"
major_version_zero = true
allowed_prefixes = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["portable: portability-sensitive tests that run on Windows, Linux and macOS"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["src", "scripts", "tests"]
strict = true
