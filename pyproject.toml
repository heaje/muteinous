[build-system]
requires = ["setuptools>=75,<85", "setuptools-scm>=8,<11"]
build-backend = "setuptools.build_meta"

[project]
name = "muteinous"
dynamic = ["version"]
description = "Muteinous"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "commitizen",
    "mypy",
    "packaging",
    "pytest",
    "pytest-xdist[psutil]",
    "ruff",
    "setuptools",
    "setuptools-scm",
    "wheel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
version_scheme = "pep440"
major_version_zero = true
allowed_prefixes = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = ["portable: portability-sensitive tests that run on Windows, Linux and macOS"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
files = ["src", "scripts", "tests", "experiments"]
mypy_path = ["src"]
explicit_package_bases = true
strict = true
