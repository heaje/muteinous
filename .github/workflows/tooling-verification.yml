name: Temporary tooling acceptance verification
on:
  pull_request:
permissions:
  contents: read
jobs:
  local-tooling:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.9'
      - uses: go-task/setup-task@v1
      - name: Taskfile parses and missing setup is refused
        shell: bash
        run: |
          task --list
          if task lint; then echo "Missing environment unexpectedly accepted"; exit 1; fi
          test ! -e .venv
      - name: Locked setup
        run: task setup
      - name: Windows aggregate check
        if: runner.os == 'Windows'
        run: task check
      - name: Portable tests
        if: runner.os != 'Windows'
        run: task test -- -m portable
      - name: Portable distribution build
        if: runner.os != 'Windows'
        run: task build
      - name: Portable version preview
        if: runner.os != 'Windows'
        run: task version-preview
      - name: Clean only reproducible caches
        shell: bash
        run: |
          mkdir -p .pytest_cache .mypy_cache .ruff_cache
          echo keep > local-user-file.txt
          task clean
          test ! -e .pytest_cache
          test ! -e .mypy_cache
          test ! -e .ruff_cache
          test -d .venv
          test -d dist
          test -f local-user-file.txt
