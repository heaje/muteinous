name: Pull request checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    name: Windows package and tests
    runs-on: windows-2025
    timeout-minutes: 30 # Safety net; pytest has its own 10-minute step timeout.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.9'
      - uses: go-task/setup-task@v2

      - name: Report Windows runner CPU count
        shell: pwsh
        run: |
          $logical = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          Write-Host "Windows runner logical CPUs: $logical"
          if ($logical -ne 4) {
            Write-Host "::warning::Runner differs from the four-vCPU performance baseline; test timing is not directly comparable."
          }

      - name: Set up locked environment
        run: task setup
      - name: Validate editable import and built distributions
        run: |
          .\.venv\Scripts\python.exe -c "import muteinous; print(muteinous.__file__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          task build

      - name: Ruff lint
        run: task lint

      - name: Ruff format
        run: task format-check

      - name: Strict type check
        run: task typecheck

      - name: Verify decision ID synchronization
        run: task decisions

      - name: Conventional Commits and PR title
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe -m commitizen check --rev-range "$env:BASE_SHA..${env:HEAD_SHA}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\.venv\Scripts\python.exe -m commitizen check --message "$env:PR_TITLE"
          exit $LASTEXITCODE

      - name: Version preview
        run: task version-preview

      - name: Pytest (logical CPUs, independent 10-minute timeout)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          task test
          $testExitCode = $LASTEXITCODE
          $stopwatch.Stop()
          $elapsed = '{0:F3}' -f $stopwatch.Elapsed.TotalSeconds
          Write-Host "test step wall time (includes Task readiness checks): $elapsed seconds; exit: $testExitCode"
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Test step wall time (includes Task readiness checks): $elapsed seconds; exit: $testExitCode"
          }
          exit $testExitCode

  portability:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            check: Linux portability
          - runner: macos-26
            check: macOS portability
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.9'
      - uses: go-task/setup-task@v2

      - name: Set up locked environment
        run: task setup

      - name: Validate editable import and built distributions
        run: |
          .venv/bin/python -c "import muteinous; print(muteinous.__file__)"
          task build

      - name: Portable pytest subset
        run: task test -- -m portable -n 2
