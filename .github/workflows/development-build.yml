name: Manual development build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validated development distributions
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.9'
      - uses: go-task/setup-task@v2
      - name: Set up locked environment
        run: task setup
      - name: Build and validate fresh distributions
        shell: pwsh
        run: |
          & .\.venv\Scripts\python.exe scripts/release.py dev --sha "$env:GITHUB_SHA" --output "$env:RUNNER_TEMP/dev-artifacts"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        with:
          name: development-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dev-artifacts/
          if-no-files-found: error
