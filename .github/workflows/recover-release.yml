name: Recover failed unpublished release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact failed release tag
        required: true
        type: string
      sha:
        description: Exact original 40-character source SHA
        required: true
        type: string
      evidence:
        description: Operator evidence that this version has never been published
        required: true
        type: string
      confirmation:
        description: 'Type NEVER PUBLISHED <tag> <sha> after checking the release history'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: muteinous-official-release
  cancel-in-progress: false

jobs:
  recover:
    name: Explicit unpublished-release recovery
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Dispatch recovery from main only"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Git needs this credential for the lease-protected tag deletion.
          persist-credentials: true
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.9'
      - uses: go-task/setup-task@v2
      - name: Set up locked environment
        run: task setup
      - name: Check recovery confirmation and reset unpublished release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
          EVIDENCE: ${{ inputs.evidence }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          .venv/bin/python scripts/release.py recover --tag "$TAG" --sha "$SHA" --evidence "$EVIDENCE" --confirmation "$CONFIRMATION"
