name: Temporary Python compatibility investigation

on:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: '0.13.9'
      - name: Check candidate Python and Hushpatch dependency wheels
        shell: pwsh
        env:
          CANDIDATE: ${{ matrix.python }}
        run: |
          uv python install $env:CANDIDATE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --python $env:CANDIDATE .ci/compat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = ".ci/compat/Scripts/python.exe"
          & $python -VV
          # Candidate dependencies, not adopted runtime requirements.
          $requirements = @(
            "faster-whisper>=1.2.1",
            "cryptography==50.0.2",
            "lz4==4.4.5",
            "numpy>=2.5.4",
            "onnxruntime-windowsml>=1.30",
            "onnxruntime-genai-winml>=0.17.1",
            "platformdirs>=4.3",
            "psutil>=7",
            "tomli-w>=1.2",
            "pyside6-essentials>=6.12.0",
            "pyside6-addons>=6.12.0",
            "pyyaml>=6.0.3",
            "zstandard==0.25.0"
          )
          # Preserve Hushpatch's runtime substitution, not its game-specific code.
          Set-Content .ci/override.txt "onnxruntime>=1.14; sys_platform != 'win32'"
          $failed = @()
          foreach ($requirement in $requirements) {
            Write-Host "PROBE: $requirement"
            uv pip install --python $python --dry-run --only-binary :all: --override .ci/override.txt $requirement
            if ($LASTEXITCODE -ne 0) { $failed += $requirement }
          }
          Write-Host "FAILED PROBES: $($failed -join ', ')"
          if ($failed.Count -ne 0) { exit 1 }
          uv pip install --python $python --only-binary :all: --override .ci/override.txt @requirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip list --python $python
          & $python -c "import faster_whisper, ctranslate2, cryptography, lz4.frame, numpy, onnxruntime, onnxruntime_genai, platformdirs, psutil, tomli_w, PySide6.QtCore, PySide6.QtWidgets, PySide6.QtMultimedia, yaml, zstandard; print('Candidate imports succeeded')"
          exit $LASTEXITCODE
